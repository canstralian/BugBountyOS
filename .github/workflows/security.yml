name: "Security OS — Static Analysis & Vulnerability Scanning"

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  schedule:
    # Full security sweep every Monday at 03:00 UTC
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Semgrep — fast, rule-based SAST (blocks PR merges on failure)
  # ──────────────────────────────────────────────────────────────────────────
  semgrep:
    name: "Semgrep · Security Audit"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: >
      github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep security scan
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --sarif \
            --output semgrep-results.sarif \
            --error

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Upload SARIF as build artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif-${{ github.run_id }}
          path: semgrep-results.sarif
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────
  # CodeQL deep analysis is provided by the repository's default Code Scanning
  # setup (the `Analyze (python)` / `Analyze (actions)` /
  # `Analyze (javascript-typescript)` checks). Re-running CodeQL here would
  # duplicate that analysis and collide on SARIF upload (same
  # category: /language:python), so this workflow intentionally omits it.
  # ──────────────────────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────────────────────────────────
  # Shell script linting (BugBountyOS contains shell scripts)
  # ──────────────────────────────────────────────────────────────────────────
  shellcheck:
    name: "ShellCheck · Shell Script Security Lint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          find . -type f -name "*.sh" -print0 | xargs -0 -r shellcheck --severity=warning

  # ──────────────────────────────────────────────────────────────────────────
  # Secret scanning hardening
  # ──────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: "Secret Scan · Credential Leak Detection"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
