[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bbos"
version = "0.1.0"
description = "BugBountyOS control-plane CLI and read-only workspace TUI."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
tui = ["textual>=0.60"]

[project.scripts]
bbos = "bbos.cli:main"
bbos-tui = "bbos.cli:tui_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bbos*"]
