[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vectors/dashboard/node_modules", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"vectors/pipeline/models.py" = ["F821"]
"vectors/pipeline/routes.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
