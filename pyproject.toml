[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
  ".git",
  ".venv",
  "dist",
  "build",
  "node_modules",
  "__pycache__",
  ".mypy_cache",
  ".pytest_cache",
  "coverage",
]

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "I", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
  "^\\.git/",
  "^\\.venv/",
  "^dist/",
  "^build/",
  "^node_modules/",
  "^__pycache__/",
  "^\\.mypy_cache/",
  "^\\.pytest_cache/",
  "^coverage/",
]
